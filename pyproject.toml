[project]
name = "geographic-equity-rotation"
version = "0.1.0"
description = "Research code for a geographic equity rotation strategy"
readme = "README.md"
authors = [
    { name = "Gerard Wu", email = "230164507+GerardWuHeston@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
]

[project.scripts]
geographic-equity-rotation = "geographic_equity_rotation:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
